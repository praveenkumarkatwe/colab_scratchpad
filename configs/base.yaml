# Base configuration for EHI Hindi Summarization System

# Random seed for reproducibility
seed: 42

# Logging configuration
logging:
  level: INFO
  structured: true
  file: null  # Set to path for file logging

# Paths and directories
paths:
  data_dir: "data"
  cache_dir: "data/cache"
  processed_dir: "data/processed" 
  output_dir: "outputs"
  logs_dir: "logs"

# Dataset configuration
dataset:
  name: "xlsum"  # xlsum, ilsum, or custom
  language: "hi"
  splits: ["train", "validation", "test"]
  max_source_length: 1024
  max_target_length: 256
  num_proc: 4  # Number of processes for data processing

# Model configuration
model:
  name: "google/mt5-small"
  use_lora: true
  load_in_8bit: false
  torch_dtype: "float32"  # float16, float32, bfloat16

# LoRA configuration
lora:
  r: 8
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules: ["q", "v", "k", "o", "wi", "wo"]  # Auto-detected if null

# NER configuration
ner:
  use_indicner: true
  use_stanza: true
  use_spacy: true
  entity_types: ["PERSON", "ORG", "LOC", "MISC"]

# EHI metric weights
ehi_weights:
  w_EF: 1.0   # Entity Faithful
  w_NH: 1.0   # Negative Hallucination
  w_LF: 1.0   # Lost Faithful
  w_OF: 1.0   # Over-Focus
  w_PH: 0.0   # Positive Hallucination (default off)

# Generation configuration
generation:
  max_new_tokens: 256
  min_length: 10
  length_penalty: 1.0
  no_repeat_ngram_size: 3
  repetition_penalty: 1.2
  early_stopping: true
  
  # Beam search settings
  do_sample: false
  num_beams: 4
  
  # Sampling settings (when do_sample=true)
  temperature: 1.0
  top_p: 0.9
  top_k: 50

# Hardware and performance
hardware:
  device_map: null  # "auto" for multi-GPU
  num_workers: 0    # Data loader workers
  pin_memory: true  # For GPU training

# Evaluation settings
evaluation:
  batch_size: 8
  max_examples: null  # null for all examples
  metrics: ["EHI", "Entity_F1", "rouge1", "rouge2", "rougeL"]
  plot_cdfs: true
  save_examples: 10  # Number of examples to save for inspection